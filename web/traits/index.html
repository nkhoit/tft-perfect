<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trait Explorer — TFTKIT</title>
<meta name="description" content="Find TFT boards where every trait does something.">
<meta property="og:site_name" content="TFTKIT">
<meta property="og:type" content="website">
<meta property="og:title" content="TFT Trait Explorer">
<meta property="og:description" content="Find TFT boards where every trait does something.">
<meta property="og:url" content="https://tftkit.com/traits/">
<meta property="og:image" content="https://tftkit.com/api/og/reyJ2IjoxfQ">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#4ade80">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="style.css?v=milp-hybrid-v9">
</head>
<body>
<header>
  <a class="kit" href="/">TFT<span>KIT</span></a>
  <h1>Trait <span class="beta">Explorer</span></h1>
  <span class="setname">Set 18 · Enchanted Wilds</span>
  <div class="meta" id="meta">loading…</div>
  <div class="spacer"></div>
  <label class="newexp" title="Use only the experimental anytime local search. Results are sampled, not optimal.">
    <input id="newExperience" type="checkbox">
    <span>Try new experience</span>
  </label>
</header>

<div class="wrap">
  <aside class="side" id="filtersPanel">
    <div class="sidehead">
      <button class="filtertoggle" id="filtersToggle" type="button"
        aria-controls="filtersContent" aria-expanded="true">
        <svg class="filtericon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 4h14l-5.5 6.2v4.4l-3 1.5v-5.9z"/>
        </svg>
        <span class="filtertoggle-label">Filters</span>
        <svg class="filterchev" viewBox="0 0 20 20" aria-hidden="true">
          <path d="m6.5 8 3.5 3.5L13.5 8"/>
        </svg>
      </button>
    </div>
    <div class="sidecontent" id="filtersContent">
    <section>
      <h2>Units <i class="q" tabindex="0" data-tip="How many units you're fielding.
Usually your level, but a Tactician's Crown or an augment can push it higher.
Some units consume two slots, and traits can increase the limit.">?</i></h2>
      <div class="slider">
        <input type="range" id="size" min="2" max="12" value="8"
          title="How many units you're fielding. Usually your level, but a Tactician's Crown can push it past 10.">
        <output id="sizeV">8</output>
      </div>
    </section>

    <section>
      <h2>Wasted trait slots allowed <i class="q" tabindex="0" data-tip="Trait slots that aren't paying off. 0 = perfect boards only.
Counted per trait, not per unit: 2/3 Sprykin = 2 wasted.">?</i></h2>
      <div class="slider">
        <input type="range" id="waste" min="0" max="10" value="10"
          title="Counted per trait, not per unit — a unit overshooting one trait still counts toward its others.&#10;2/3 Sprykin = 2 wasted · 4/5 Riftbeast = 1 wasted">
        <output id="wasteV">10</output>
      </div>
    </section>

    <section>
      <h2>Require traits <span class="tag" id="reqTN">0</span> <i class="q" tabindex="0" data-tip="Click to require · again for the next tier.
Right click to mute: still shown on boards, but scores nothing.
Unique traits are excluded — require the unit instead.">?</i></h2>
      <div class="tgrid" id="traitGrid"></div>
    </section>

    <section>
      <h2>Cost filter <i class="q" tabindex="0" data-tip="Which unit costs the search may draw from. Required units are always allowed.">?</i></h2>
      <div class="costs" id="costs"></div>
      <div class="groupex" id="groupExclusions" hidden>
        <span class="groupexlbl">Special exclusions</span>
        <div id="groupExclusionList"></div>
      </div>
    </section>

    <section>
      <h2>Sort <i class="q" tabindex="0" data-tip="Board cost assumes every unit at 2★ (3 copies each).">?</i></h2>
      <select id="sort">
        <option value="live">Most active traits</option>
        <option value="tier">Highest trait tiers</option>
        <option value="waste">Fewest wasted</option>
        <option value="cost">Cheapest board</option>
        <option value="rich">Most expensive board</option>
      </select>
      <label class="sub">then by
        <select id="sort2">
          <option value="cost">Cheapest board</option>
          <option value="rich">Most expensive board</option>
          <option value="waste">Fewest wasted</option>
          <option value="tier">Highest trait tiers</option>
          <option value="live">Most active traits</option>
        </select>
      </label>
    </section>

    <section>
      <h2>Emblems <span class="tag" id="embN">0</span> <i class="q" tabindex="0" data-tip="Each emblem adds a free trait point without using a unit slot.
Click to add · right click to remove one.
Built for the Trait Tree encounter.">?</i></h2>
      <div class="tgrid" id="embGrid"></div>
    </section>

    <section>
      <h2>Search effort <i class="q" tabindex="0" data-tip="Quick returns approximate boards in about a second.
Balanced searches longer with more workers.
Deep uses the full search budget.">?</i></h2>
      <div class="effortctl">
        <select id="effort">
          <option value="quick">Quick</option>
          <option value="balanced">Balanced</option>
          <option value="deep" selected>Deep</option>
        </select>
        <button id="refine" type="button" disabled>Refine</button>
      </div>
    </section>
    </div>
  </aside>

  <main class="main">
    <div class="picker">
      <div class="pickhead">
        <h2>Units <span class="tag" id="pickN">0 required · 0 excluded</span> <i class="q" tabindex="0" data-tip="Left click to require · right click to exclude · click again to clear.">?</i></h2>
        <div class="pooltabs" role="tablist" aria-label="Group units by">
          <button class="active" id="poolViewCost" type="button" role="tab"
            aria-selected="true">Cost</button>
          <button id="poolViewOrigin" type="button" role="tab"
            aria-selected="false">Origin</button>
          <button id="poolViewClass" type="button" role="tab"
            aria-selected="false">Class</button>
        </div>
        <div class="pickctl">
          <input type="search" id="search" placeholder="filter units or traits…">
          <button id="saveSearch" type="button" title="Save this search on this device">Save</button>
          <details class="savedmenu" id="savedMenu">
            <summary>Saved <span id="savedN">0</span></summary>
            <div class="savedlist" id="savedList"></div>
          </details>
          <button id="share" type="button" title="Copy a Discord preview link">Copy link</button>
          <button id="clear">Clear</button>
        </div>
      </div>
      <div class="grid" id="pool"></div>
    </div>

    <div class="selected" id="selected" hidden></div>
    <div class="afbar" id="activeFilters" hidden>
      <span class="aflbl">Filtering</span>
      <div class="afchips" id="afChips"></div>
      <button class="afclear" id="afClear" type="button">Clear all</button>
    </div>

    <div class="results">
      <div class="rhead"><h2>Results</h2><div class="status" id="status"></div><div class="count" id="count">—</div></div>
      <div class="compbar" id="compBar" hidden></div>
      <div id="list"></div>
    </div>
  </main>
</div>

<script src="search-utils.js?v=milp-hybrid-v9"></script>
<script src="board-score.js?v=milp-hybrid-v9"></script>
<script src="comp-quality.js?v=milp-hybrid-v9"></script>
<script src="local-search.js?v=milp-hybrid-v9"></script>
<script src="solver-scheduler.js?v=milp-hybrid-v9"></script>
<script src="saved-searches.js?v=milp-hybrid-v9"></script>
<script src="share-state.js?v=milp-hybrid-v9"></script>
<script src="team-code.js?v=milp-hybrid-v9"></script>
<script src="app.js?v=milp-hybrid-v9"></script>
</body>
</html>
